[package]
name = "tidemark"
version = "0.1.0"
edition = "2021"
description = "Earth system trend analysis CLI — Mann-Kendall, BOCPD, ENSO correction"
license = "MIT"
repository = "https://github.com/raiyanruhan/tidemark"
homepage = "https://github.com/raiyanruhan/tidemark"
readme = "README.md"

[features]
bundled = []

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
