server {
    server_name tidemark.hylith.com;

    # Analysis endpoints — rate-limited.
    # 10 requests/min per IP, burst 4: a judge can fire 4 quick analyses
    # then one every 6s. Stops bots exhausting NASA API credentials.
    location /analyze {
        limit_req zone=tidemark_analysis burst=4 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 900;
        add_header         X-Accel-Buffering no;
    }

    location /api/analyze {
        limit_req zone=tidemark_analysis burst=4 nodelay;

        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 900;
        add_header         X-Accel-Buffering no;
    }

    # Everything else unrestricted — homepage, result pages, PDFs, explainer.
    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60;
        add_header         X-Accel-Buffering no;
    }
}
